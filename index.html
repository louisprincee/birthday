<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3eee5">
  <title>Happy Birthday</title>
  <style>
    @font-face {
      font-family: "M PLUS Rounded 1c";
      src: url("assets/m-plus-rounded-1c.ttf") format("truetype");
      font-display: swap;
    }

    :root {
      color-scheme: light;
      --ink: #332d27;
      --paper: #f7f1e5;
      --wine: #762c32;
      --serif: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "PingFang SC", sans-serif;
      --sans: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "PingFang SC", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 18% 8%, rgba(255,255,255,.82), transparent 36%),
        radial-gradient(ellipse at 86% 78%, rgba(219,201,170,.25), transparent 34%),
        #eee8dd;
      font-family: var(--sans);
    }

    button, input { font: inherit; }
    button { color: inherit; }

    .app {
      width: min(1120px, 100%);
      min-height: 100vh;
      margin: 0 auto;
      padding: 24px 34px;
      display: flex;
      flex-direction: column;
    }

    main {
      flex: 1;
      display: grid;
      place-items: center;
    }

    .book-wrap {
      width: 100%;
      display: grid;
      justify-items: center;
      gap: 22px;
    }

    .book-stage {
      position: relative;
      width: 100%;
      display: grid;
      justify-items: center;
    }

    .book {
      position: relative;
      width: min(calc(100% - 112px), 930px);
      aspect-ratio: 1.53;
      min-height: 400px;
      perspective: 1800px;
      filter: drop-shadow(0 26px 28px rgba(62, 47, 31, .19));
    }

    .cover {
      position: absolute;
      z-index: 3;
      inset: 0 auto 0 50%;
      width: min(50%, 470px);
      min-width: 310px;
      transform: translateX(-50%);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 38px 26px;
      color: #e7c98d;
      text-align: center;
      border: 1px solid #5d2027;
      border-radius: 5px 12px 12px 5px;
      background:
        linear-gradient(90deg, rgba(255,255,255,.06), transparent 5%, transparent 94%, rgba(0,0,0,.13)),
        radial-gradient(ellipse at 48% 42%, #853b3d 0%, #762e33 48%, #64252d 100%);
      box-shadow: inset 7px 0 10px rgba(30, 12, 14, .16), inset 0 0 0 1px rgba(224, 190, 123, .22);
      transition: opacity .55s ease, transform .7s cubic-bezier(.2,.8,.2,1), visibility .55s;
    }

    .cover::before, .cover::after {
      position: absolute;
      inset: 12px;
      content: "";
      border: 1px solid rgba(218, 183, 116, .42);
      border-radius: 3px 8px 8px 3px;
      pointer-events: none;
    }

    .cover::after {
      inset: 17px;
      border-color: rgba(218, 183, 116, .17);
    }

    .cover-emblem {
      position: relative;
      z-index: 1;
      width: 108px;
      height: 108px;
      margin: 0 0 19px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(224, 193, 133, .78);
      border-radius: 50%;
      box-shadow: 0 0 0 5px rgba(224, 193, 133, .08), inset 0 0 16px rgba(224, 193, 133, .08);
    }

    .cover-emblem::before {
      position: absolute;
      inset: 5px;
      content: "";
      border: 1px solid rgba(224, 193, 133, .42);
      border-radius: 50%;
    }

    .cover-emblem svg {
      width: 66px;
      height: 66px;
      fill: none;
      stroke: #e9cd94;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 1.15;
    }

    .cover-country {
      position: relative;
      z-index: 1;
      margin: 0;
      font-size: 24px;
      letter-spacing: .16em;
    }

    .cover-country-en {
      position: relative;
      z-index: 1;
      margin: 5px 0 0;
      font-family: Georgia, serif;
      font-size: 11px;
      letter-spacing: .18em;
    }

    .cover-title {
      position: relative;
      z-index: 1;
      margin: 22px 0 0;
      display: flex;
      justify-content: center;
      gap: .48em;
      font-family: var(--serif);
      font-size: clamp(38px, 4.7vw, 50px);
      font-weight: 500;
      letter-spacing: .12em;
      line-height: 1.15;
    }

    .cover-en {
      position: relative;
      z-index: 1;
      margin: 8px 0 0;
      font-family: Georgia, serif;
      font-size: 16px;
      letter-spacing: .2em;
    }

    .cover-chip {
      position: relative;
      z-index: 1;
      width: 34px;
      height: 24px;
      margin: 24px 0 0;
      fill: none;
      stroke: #e9cd94;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 1.5;
    }

    .spread {
      position: absolute;
      inset: 0;
      display: grid;
      grid-template-columns: 1fr 1fr;
      overflow: hidden;
      border: 1px solid #c8baa3;
      border-radius: 6px;
      background: var(--paper);
      opacity: 0;
      visibility: hidden;
      transition: opacity .45s ease, visibility .45s;
    }

    .spread::after {
      position: absolute;
      z-index: 2;
      top: 0;
      bottom: 0;
      left: 50%;
      width: 24px;
      content: "";
      transform: translateX(-50%);
      background: linear-gradient(90deg, rgba(78,57,34,.10), rgba(255,255,255,.38) 46%, rgba(78,57,34,.08));
      pointer-events: none;
    }

    .book.is-open .cover {
      opacity: 0;
      visibility: hidden;
      transform: translateX(-50%) rotateY(-27deg) scale(.96);
      pointer-events: none;
    }

    .book.is-open .spread { opacity: 1; visibility: visible; }

    .paper {
      position: relative;
      min-width: 0;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 18% 16%, rgba(255,255,255,.7), transparent 46%),
        repeating-linear-gradient(0deg, rgba(110,84,53,.018) 0, rgba(110,84,53,.018) 1px, transparent 1px, transparent 4px),
        var(--paper);
    }

    .left-page {
      padding: clamp(24px, 4vw, 44px) clamp(22px, 4vw, 46px);
      display: flex;
      flex-direction: column;
      border-right: 1px solid rgba(159, 139, 111, .24);
    }

    .dedication {
      margin: 16px 0 5px;
      font-family: var(--serif);
      font-size: clamp(19px, 2.5vw, 27px);
      font-weight: 500;
    }

    .name-input {
      width: 100%;
      max-width: 260px;
      padding: 5px 0 7px;
      border: 0;
      border-bottom: 1px solid #c9b797;
      border-radius: 0;
      outline: none;
      color: var(--wine);
      background: transparent;
      font-family: var(--serif);
      font-size: 19px;
    }

    .name-input:focus { border-bottom-color: var(--wine); }
    .name-input::placeholder { color: #b6a58e; }

    .card-message {
      width: 100%;
      min-height: 190px;
      flex: 1;
      margin: 20px 0 0;
      padding: 8px 0;
      resize: none;
      border: 0;
      outline: none;
      color: #70665a;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0,
        transparent calc(2em - 1px),
        rgba(159, 139, 111, .24) calc(2em - 1px),
        rgba(159, 139, 111, .24) 2em
      );
      font-family: var(--serif);
      font-size: 16px;
      line-height: 2;
    }

    .card-message::placeholder { color: #b6a58e; }

    .card-message:focus-visible {
      outline: 2px solid #a87b53;
      outline-offset: 3px;
    }

    .right-page {
      padding: clamp(20px, 3vw, 34px) clamp(20px, 3vw, 34px) 25px;
      display: flex;
      flex-direction: column;
    }

    .scene-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin: 1px 1px 13px;
    }

    .scene-title {
      margin: 0;
      font-family: var(--serif);
      font-size: clamp(21px, 2.6vw, 29px);
      font-weight: 500;
      letter-spacing: .08em;
    }

    .photo-frame {
      position: relative;
      flex: 1;
      min-height: 0;
      overflow: hidden;
      padding: 6px;
      border: 1px solid #d8cbb6;
      background: #fffaf1;
      box-shadow: 0 3px 8px rgba(72, 53, 32, .10);
    }

    .scene-photo {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      filter: saturate(.88) contrast(.96);
      background: #d7c8b0;
    }

    .book.turning .right-page { animation: turn-page .52s ease both; }
    .book.turning .left-page { animation: settle-page .52s ease both; }

    @keyframes turn-page {
      0% { transform: perspective(1000px) rotateY(0); filter: brightness(1); }
      45% { transform: perspective(1000px) rotateY(-9deg); filter: brightness(.86); }
      100% { transform: perspective(1000px) rotateY(0); filter: brightness(1); }
    }

    @keyframes settle-page {
      0%, 100% { opacity: 1; }
      45% { opacity: .58; }
    }

    .nav-button {
      position: absolute;
      z-index: 4;
      top: 50%;
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      padding: 0;
      border: 1px solid #ddc6ae;
      border-radius: 50%;
      color: #5d5044;
      background: rgba(255, 250, 241, .92);
      box-shadow: 0 3px 10px rgba(72, 53, 32, .12);
      font-size: 28px;
      line-height: 1;
      cursor: pointer;
      transform: translateY(-50%);
      transition: background .2s, border-color .2s, box-shadow .2s, transform .2s;
    }

    .nav-button:hover:not(:disabled) {
      border-color: #c49372;
      background: #fffdf8;
      box-shadow: 0 5px 13px rgba(72, 53, 32, .18);
      transform: translateY(calc(-50% - 2px));
    }

    .nav-button:focus-visible, .name-input:focus-visible {
      outline: 2px solid #a87b53;
      outline-offset: 3px;
    }

    .prev-button { left: 0; }
    .next-button { right: 0; }

    .nav-button:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    @media (max-width: 700px) {
      .app { padding: 16px; }
      .book-stage { padding: 0 30px; }
      .book { aspect-ratio: auto; min-height: 0; }
      .nav-button {
        width: 28px;
        height: 28px;
        font-size: 20px;
      }
      .cover {
        position: relative;
        left: auto;
        width: min(100%, 390px);
        min-width: 0;
        height: min(133vw, 540px);
        min-height: 430px;
        margin: 0 auto;
        transform: none;
      }
      .book.is-open .cover { display: none; }
      .spread {
        position: relative;
        grid-template-columns: 1fr;
        aspect-ratio: auto;
        min-height: 670px;
      }
      .spread::after { display: none; }
      .left-page { min-height: 320px; padding: 25px 24px 22px; }
      .dedication { margin-top: 12px; }
      .card-message { margin-top: 12px; }
      .right-page { min-height: 370px; padding: 22px 20px 19px; }
      .photo-frame { min-height: 245px; }
      .book { width: 100%; }
      .nav-button { left: 0; }
      .next-button { right: 0; left: auto; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <main>
      <div class="book-wrap">
        <div class="book-stage">
          <button class="nav-button prev-button" id="prev-button" type="button" aria-label="上一页" disabled>‹</button>
          <section class="book" id="book" aria-label="日本旅行护照">
            <div class="cover" aria-label="旅行护照封面">
              <div class="cover-emblem" aria-hidden="true">
                <svg viewBox="0 0 64 64">
                  <path d="M32 10 36 26 48 16 38 28 54 32 38 36 48 48 36 38 32 54 28 38 16 48 26 36 10 32 26 28 16 16 28 26Z"/>
                  <circle cx="32" cy="32" r="3.5"/>
                  <circle cx="32" cy="32" r="19"/>
                  <path d="M32 5v4m0 46v4M5 32h4m46 0h4"/>
                </svg>
              </div>
              <p class="cover-country">LIA第二支部</p>
              <p class="cover-country-en">LIA SECOND BRANCH</p>
              <h1 class="cover-title"><span>护</span><span>照</span></h1>
              <p class="cover-en">PASSPORT</p>
              <svg class="cover-chip" viewBox="0 0 36 26" aria-hidden="true">
                <rect x="2" y="2" width="32" height="22" rx="3"/>
                <path d="M2 9h8l4 4-4 4H2m32-8h-8l-4 4 4 4h8"/>
              </svg>
            </div>

            <div class="spread" aria-live="polite">
              <section class="paper left-page" aria-label="生日贺卡">
                <h2 class="dedication">写给</h2>
                <input class="name-input" id="friend-name" type="text" maxlength="24" placeholder="亲爱的你" aria-label="收礼人的名字">
                <textarea class="card-message" id="birthday-message" maxlength="1000" aria-label="生日祝福" placeholder="在这里写下生日祝福……">生日快乐！愿新的一岁里，你喜欢的事都有回响，想去的地方都能抵达。愿每一天都有小小的惊喜，也一直被温柔与爱包围。出发去看世界吧，下一站我们一起去！</textarea>
              </section>
              <section class="paper right-page" aria-label="目的地风景">
                <div class="scene-head">
                  <h2 class="scene-title" id="scene-title">JAPAN TRIP</h2>
                </div>
                <div class="photo-frame">
                  <img class="scene-photo" id="scene-photo" alt="A scenic view of Japan">
                </div>
              </section>
            </div>
          </section>
          <button class="nav-button next-button" id="next-button" type="button" aria-label="打开护照">›</button>
        </div>
      </div>
    </main>

  </div>

  <script>
    const destinations = [
      {
        title: "VISA",
        image: "assets/visa.jpg",
        alt: "A Japan map on the visa page",
        position: "center"
      },
      {
        title: "TOKYO",
        image: "assets/tokyo.jpg",
        alt: "Tokyo Tower rising above the city",
        position: "center"
      },
      {
        title: "MT. FUJI",
        image: "assets/fuji.jpg",
        alt: "Mount Fuji framed by cherry blossoms",
        position: "center 52%"
      },
      {
        title: "OSAKA",
        image: "assets/osaka.jpg",
        alt: "A lively street in Osaka",
        position: "center"
      },
      {
        title: "KYOTO",
        image: "assets/kyoto.jpg",
        alt: "A traditional Kyoto street and temple",
        position: "center"
      },
      {
        title: "HOKKAIDO",
        image: "assets/hokkaido.jpg",
        alt: "Snowy mountains in Hokkaido",
        position: "center"
      },
      {
        title: "NEXT STOP",
        image: "assets/next-stop.jpg",
        alt: "The Louvre pyramid glowing beneath the evening sky",
        position: "center"
      }
    ];

    const book = document.querySelector("#book");
    const prevButton = document.querySelector("#prev-button");
    const nextButton = document.querySelector("#next-button");
    const photo = document.querySelector("#scene-photo");
    const nameInput = document.querySelector("#friend-name");
    const messageInput = document.querySelector("#birthday-message");
    let activePage = -1;
    let isTurning = false;

    const savedName = localStorage.getItem("birthday-passport-name");
    if (savedName) nameInput.value = savedName;
    const defaultMessage = "生日快乐！愿新的一岁里，你喜欢的事都有回响，想去的地方都能抵达。愿每一天都有小小的惊喜，也一直被温柔与爱包围。出发去看世界吧，下一站我们一起去！";
    const savedMessage = localStorage.getItem("birthday-passport-message");
    if (savedMessage === null || savedMessage === "生日快乐！新的一岁，也要去看喜欢的风景。") {
      messageInput.value = defaultMessage;
    } else {
      messageInput.value = savedMessage;
    }
    nameInput.addEventListener("input", () => {
      localStorage.setItem("birthday-passport-name", nameInput.value);
    });
    messageInput.addEventListener("input", () => {
      localStorage.setItem("birthday-passport-message", messageInput.value);
    });

    function renderPage() {
      const page = destinations[activePage];
      document.querySelector("#scene-title").textContent = page.title;
      photo.alt = page.alt;
      photo.style.objectPosition = page.position;
      photo.src = page.image;
      prevButton.disabled = false;
      nextButton.textContent = "›";
      nextButton.setAttribute("aria-label", activePage === destinations.length - 1 ? "回到封面" : "下一页");
    }

    function turn(direction) {
      if (isTurning) return;
      if (activePage === -1 && direction > 0) {
        activePage = 0;
        book.classList.add("is-open");
        renderPage();
        return;
      }
      if (activePage === destinations.length - 1 && direction > 0) {
        activePage = -1;
        book.classList.remove("is-open");
        prevButton.disabled = true;
        nextButton.textContent = "›";
        nextButton.setAttribute("aria-label", "打开护照");
        return;
      }
      const nextPage = activePage + direction;
      if (nextPage < 0) {
        activePage = -1;
        book.classList.remove("is-open");
        prevButton.disabled = true;
        nextButton.textContent = "›";
        nextButton.setAttribute("aria-label", "打开护照");
        return;
      }
      if (nextPage >= destinations.length) return;
      isTurning = true;
      book.classList.add("turning");
      window.setTimeout(() => {
        activePage = nextPage;
        renderPage();
        book.classList.remove("turning");
        isTurning = false;
      }, 260);
    }

    prevButton.addEventListener("click", () => turn(-1));
    nextButton.addEventListener("click", () => turn(1));
    document.addEventListener("keydown", (event) => {
      if (event.target instanceof HTMLInputElement) return;
      if (event.key === "ArrowRight") turn(1);
      if (event.key === "ArrowLeft") turn(-1);
    });
  </script>
</body>
</html>
