<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3eee5">
  <title>给你的日本旅行</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #332d27;
      --paper: #f7f1e5;
      --wine: #762c32;
      --serif: "Iowan Old Style", "Baskerville", "Songti SC", "Noto Serif CJK SC", serif;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 18% 8%, rgba(255,255,255,.82), transparent 36%),
        radial-gradient(ellipse at 86% 78%, rgba(219,201,170,.25), transparent 34%),
        #eee8dd;
      font-family: var(--sans);
    }

    button, input { font: inherit; }
    button { color: inherit; }

    .app {
      width: min(1120px, 100%);
      min-height: 100vh;
      margin: 0 auto;
      padding: 24px 34px;
      display: flex;
      flex-direction: column;
    }

    main {
      flex: 1;
      display: grid;
      place-items: center;
    }

    .book-wrap {
      width: 100%;
      display: grid;
      justify-items: center;
      gap: 22px;
    }

    .book {
      position: relative;
      width: min(100%, 930px);
      aspect-ratio: 1.53;
      min-height: 400px;
      perspective: 1800px;
      filter: drop-shadow(0 26px 28px rgba(62, 47, 31, .19));
    }

    .cover {
      position: absolute;
      z-index: 3;
      inset: 0 auto 0 50%;
      width: min(50%, 470px);
      min-width: 310px;
      transform: translateX(-50%);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 38px 26px;
      color: #e7c98d;
      text-align: center;
      border: 1px solid #5d2027;
      border-radius: 5px 12px 12px 5px;
      background:
        linear-gradient(90deg, rgba(255,255,255,.06), transparent 5%, transparent 94%, rgba(0,0,0,.13)),
        radial-gradient(ellipse at 48% 42%, #853b3d 0%, #762e33 48%, #64252d 100%);
      box-shadow: inset 7px 0 10px rgba(30, 12, 14, .16), inset 0 0 0 1px rgba(224, 190, 123, .22);
      transition: opacity .55s ease, transform .7s cubic-bezier(.2,.8,.2,1), visibility .55s;
    }

    .cover::before, .cover::after {
      position: absolute;
      inset: 12px;
      content: "";
      border: 1px solid rgba(218, 183, 116, .42);
      border-radius: 3px 8px 8px 3px;
      pointer-events: none;
    }

    .cover::after {
      inset: 17px;
      border-color: rgba(218, 183, 116, .17);
    }

    .cover-emblem {
      position: relative;
      z-index: 1;
      width: 96px;
      height: 96px;
      margin: 0 0 26px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(224, 193, 133, .78);
      border-radius: 50%;
      box-shadow: 0 0 0 5px rgba(224, 193, 133, .08), inset 0 0 16px rgba(224, 193, 133, .08);
    }

    .cover-emblem::before {
      position: absolute;
      inset: 5px;
      content: "";
      border: 1px solid rgba(224, 193, 133, .42);
      border-radius: 50%;
    }

    .cover-emblem svg {
      width: 58px;
      height: 58px;
      fill: none;
      stroke: #e9cd94;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 1.15;
    }

    .cover-title {
      position: relative;
      z-index: 1;
      margin: 0;
      font-family: var(--serif);
      font-size: clamp(27px, 3.5vw, 36px);
      font-weight: 500;
      letter-spacing: .28em;
      text-indent: .28em;
    }

    .cover-en {
      position: relative;
      z-index: 1;
      margin: 12px 0 0;
      font-family: Georgia, serif;
      font-size: 13px;
      letter-spacing: .34em;
    }

    .spread {
      position: absolute;
      inset: 0;
      display: grid;
      grid-template-columns: 1fr 1fr;
      overflow: hidden;
      border: 1px solid #c8baa3;
      border-radius: 6px;
      background: var(--paper);
      opacity: 0;
      visibility: hidden;
      transition: opacity .45s ease, visibility .45s;
    }

    .spread::after {
      position: absolute;
      z-index: 2;
      top: 0;
      bottom: 0;
      left: 50%;
      width: 24px;
      content: "";
      transform: translateX(-50%);
      background: linear-gradient(90deg, rgba(78,57,34,.10), rgba(255,255,255,.38) 46%, rgba(78,57,34,.08));
      pointer-events: none;
    }

    .book.is-open .cover {
      opacity: 0;
      visibility: hidden;
      transform: translateX(-50%) rotateY(-27deg) scale(.96);
      pointer-events: none;
    }

    .book.is-open .spread { opacity: 1; visibility: visible; }

    .paper {
      position: relative;
      min-width: 0;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 18% 16%, rgba(255,255,255,.7), transparent 46%),
        repeating-linear-gradient(0deg, rgba(110,84,53,.018) 0, rgba(110,84,53,.018) 1px, transparent 1px, transparent 4px),
        var(--paper);
    }

    .left-page {
      padding: clamp(24px, 4vw, 44px) clamp(22px, 4vw, 46px);
      display: flex;
      flex-direction: column;
      border-right: 1px solid rgba(159, 139, 111, .24);
    }

    .dedication {
      margin: 16px 0 5px;
      font-family: var(--serif);
      font-size: clamp(19px, 2.5vw, 27px);
      font-weight: 500;
    }

    .name-input {
      width: 100%;
      max-width: 260px;
      padding: 5px 0 7px;
      border: 0;
      border-bottom: 1px solid #c9b797;
      border-radius: 0;
      outline: none;
      color: var(--wine);
      background: transparent;
      font-family: var(--serif);
      font-size: 19px;
    }

    .name-input:focus { border-bottom-color: var(--wine); }
    .name-input::placeholder { color: #b6a58e; }

    .dedication-copy {
      max-width: 280px;
      margin: 15px 0 0;
      color: #70665a;
      font-family: var(--serif);
      font-size: 14px;
      line-height: 1.9;
    }

    .route {
      margin: auto 0 0;
      padding: 16px 0 0;
      border-top: 1px solid #d9cdb9;
      list-style: none;
    }

    .route li {
      display: grid;
      align-items: center;
      padding: 7px 0;
      color: #6a5d50;
      font-size: 13px;
    }

    .right-page {
      padding: clamp(20px, 3vw, 34px) clamp(20px, 3vw, 34px) 25px;
      display: flex;
      flex-direction: column;
    }

    .scene-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin: 1px 1px 13px;
    }

    .scene-title {
      margin: 0;
      font-family: var(--serif);
      font-size: clamp(21px, 2.6vw, 29px);
      font-weight: 500;
      letter-spacing: .08em;
    }

    .photo-frame {
      position: relative;
      flex: 1;
      min-height: 0;
      overflow: hidden;
      padding: 6px;
      border: 1px solid #d8cbb6;
      background: #fffaf1;
      box-shadow: 0 3px 8px rgba(72, 53, 32, .10);
    }

    .scene-photo {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      filter: saturate(.88) contrast(.96);
      background: #d7c8b0;
    }

    .book.turning .right-page { animation: turn-page .52s ease both; }
    .book.turning .left-page { animation: settle-page .52s ease both; }

    @keyframes turn-page {
      0% { transform: perspective(1000px) rotateY(0); filter: brightness(1); }
      45% { transform: perspective(1000px) rotateY(-9deg); filter: brightness(.86); }
      100% { transform: perspective(1000px) rotateY(0); filter: brightness(1); }
    }

    @keyframes settle-page {
      0%, 100% { opacity: 1; }
      45% { opacity: .58; }
    }

    .controls {
      width: min(100%, 930px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .control-hint {
      color: #887b6d;
      font-size: 11px;
    }

    .control-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .nav-button {
      min-width: 104px;
      padding: 10px 15px;
      border: 1px solid #c9b89d;
      border-radius: 3px;
      color: #5d5044;
      background: rgba(255, 252, 246, .52);
      cursor: pointer;
      transition: background .2s, border-color .2s, transform .2s;
    }

    .nav-button:hover:not(:disabled) {
      border-color: #9f7956;
      background: #fbf7ef;
      transform: translateY(-1px);
    }

    .nav-button:focus-visible, .name-input:focus-visible {
      outline: 2px solid #a87b53;
      outline-offset: 3px;
    }

    .nav-button:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    .next-button {
      border-color: var(--wine);
      color: #fff8eb;
      background: var(--wine);
    }

    .next-button:hover:not(:disabled) { background: #63242c; }

    @media (max-width: 700px) {
      .app { padding: 16px; }
      .book { aspect-ratio: auto; min-height: 0; }
      .cover {
        position: relative;
        left: auto;
        width: min(100%, 390px);
        min-width: 0;
        height: min(133vw, 540px);
        min-height: 430px;
        margin: 0 auto;
        transform: none;
      }
      .book.is-open .cover { display: none; }
      .spread {
        position: relative;
        grid-template-columns: 1fr;
        aspect-ratio: auto;
        min-height: 670px;
      }
      .spread::after { display: none; }
      .left-page { min-height: 290px; padding: 25px 24px 22px; }
      .dedication { margin-top: 12px; }
      .dedication-copy { margin-top: 10px; }
      .route { padding-top: 10px; }
      .route li { padding: 4px 0; }
      .right-page { min-height: 370px; padding: 22px 20px 19px; }
      .photo-frame { min-height: 245px; }
      .controls { align-items: flex-start; }
      .nav-button { min-width: 86px; padding: 10px 11px; font-size: 12px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <main>
      <div class="book-wrap">
        <section class="book" id="book" aria-label="日本旅行护照">
          <div class="cover" aria-label="旅行护照封面">
            <div class="cover-emblem" aria-hidden="true">
              <svg viewBox="0 0 64 64">
                <path d="M32 10 36 26 48 16 38 28 54 32 38 36 48 48 36 38 32 54 28 38 16 48 26 36 10 32 26 28 16 16 28 26Z"/>
                <circle cx="32" cy="32" r="3.5"/>
                <circle cx="32" cy="32" r="19"/>
                <path d="M32 5v4m0 46v4M5 32h4m46 0h4"/>
              </svg>
            </div>
            <h1 class="cover-title">护照</h1>
            <p class="cover-en">PASSPORT</p>
          </div>

          <div class="spread" aria-live="polite">
            <section class="paper left-page" aria-label="旅程寄语与目录">
              <h2 class="dedication">写给</h2>
              <input class="name-input" id="friend-name" type="text" maxlength="24" placeholder="亲爱的你" aria-label="收礼人的名字">
              <p class="dedication-copy" id="dedication-copy">生日快乐！新的一岁，也要去看喜欢的风景。</p>
              <ol class="route" aria-label="日本旅程目录">
                <li>东京 · 城市漫游</li>
                <li>富士山 · 山与湖</li>
                <li>大阪 · 好吃好逛</li>
                <li>北海道 · 雪与花</li>
              </ol>
            </section>
            <section class="paper right-page" aria-label="目的地风景">
              <div class="scene-head">
                <h2 class="scene-title" id="scene-title">日本旅行</h2>
              </div>
              <div class="photo-frame">
                <img class="scene-photo" id="scene-photo" alt="日本旅行风景">
              </div>
            </section>
          </div>
        </section>

        <nav class="controls" aria-label="翻页控制">
          <span class="control-hint" id="control-hint" aria-live="polite"></span>
          <div class="control-actions">
            <button class="nav-button" id="prev-button" type="button" disabled hidden>‹ 上一页</button>
            <button class="nav-button next-button" id="next-button" type="button" aria-label="打开护照">打开护照 &nbsp;›</button>
          </div>
        </nav>
      </div>
    </main>

  </div>

  <script>
    const destinations = [
      {
        title: "京都",
        image: "assets/kyoto-visa.jpg",
        alt: "京都街巷与传统日式建筑",
        position: "center 55%"
      },
      {
        title: "东京",
        image: "assets/tokyo.jpg",
        alt: "东京城市街景与夜色",
        position: "center"
      },
      {
        title: "富士山",
        image: "assets/fuji.jpg",
        alt: "富士山与湖面风景",
        position: "center 52%"
      },
      {
        title: "大阪",
        image: "assets/osaka.jpg",
        alt: "大阪城市与日本街景",
        position: "center"
      },
      {
        title: "北海道",
        image: "assets/hokkaido.jpg",
        alt: "冬日雪山与星空",
        position: "center"
      },
      {
        title: "京都",
        image: "assets/kyoto.jpg",
        alt: "京都传统街道与寺院",
        position: "center"
      },
      {
        title: "生日快乐",
        image: "assets/next-stop.jpg",
        alt: "夜空下的日本风景",
        position: "center"
      }
    ];

    const book = document.querySelector("#book");
    const prevButton = document.querySelector("#prev-button");
    const nextButton = document.querySelector("#next-button");
    const hint = document.querySelector("#control-hint");
    const photo = document.querySelector("#scene-photo");
    const nameInput = document.querySelector("#friend-name");
    let activePage = -1;
    let isTurning = false;

    const savedName = localStorage.getItem("birthday-passport-name");
    if (savedName) nameInput.value = savedName;
    nameInput.addEventListener("input", () => {
      localStorage.setItem("birthday-passport-name", nameInput.value);
    });

    function renderPage() {
      const page = destinations[activePage];
      document.querySelector("#scene-title").textContent = page.title;
      photo.alt = page.alt;
      photo.style.objectPosition = page.position;
      photo.src = page.image;
      prevButton.disabled = false;
      prevButton.hidden = false;
      nextButton.textContent = activePage === destinations.length - 1 ? "回到封面  ›" : "下一页  ›";
      nextButton.setAttribute("aria-label", activePage === destinations.length - 1 ? "回到封面" : "下一页");
      hint.textContent = `${String(activePage + 1).padStart(2, "0")} / ${String(destinations.length).padStart(2, "0")}`;
    }

    function turn(direction) {
      if (isTurning) return;
      if (activePage === -1 && direction > 0) {
        activePage = 0;
        book.classList.add("is-open");
        renderPage();
        return;
      }
      if (activePage === destinations.length - 1 && direction > 0) {
        activePage = -1;
        book.classList.remove("is-open");
        prevButton.disabled = true;
        prevButton.hidden = true;
        nextButton.textContent = "打开护照  ›";
        nextButton.setAttribute("aria-label", "打开护照");
        hint.textContent = "";
        return;
      }
      const nextPage = activePage + direction;
      if (nextPage < 0) {
        activePage = -1;
        book.classList.remove("is-open");
        prevButton.disabled = true;
        prevButton.hidden = true;
        nextButton.textContent = "打开护照  ›";
        nextButton.setAttribute("aria-label", "打开护照");
        hint.textContent = "";
        return;
      }
      if (nextPage >= destinations.length) return;
      isTurning = true;
      book.classList.add("turning");
      window.setTimeout(() => {
        activePage = nextPage;
        renderPage();
        book.classList.remove("turning");
        isTurning = false;
      }, 260);
    }

    prevButton.addEventListener("click", () => turn(-1));
    nextButton.addEventListener("click", () => turn(1));
    document.addEventListener("keydown", (event) => {
      if (event.target instanceof HTMLInputElement) return;
      if (event.key === "ArrowRight") turn(1);
      if (event.key === "ArrowLeft") turn(-1);
    });
  </script>
</body>
</html>
